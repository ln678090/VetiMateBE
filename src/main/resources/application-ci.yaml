# Profile dành cho GitHub Actions CI
# Disable Redis và các service không cần thiết khi chạy test schema
spring:
  profiles:
    active: ci
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      username: ""
      password: ""
