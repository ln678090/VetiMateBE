spring:
  profiles:
    active: dev
  application:
    name: graduationProject
  config:
    import: optional:file:.env.properties
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME_POSTGRES}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: true
  data:
    redis:
      #      url: ${REDIS_URL}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
rsa:
  private-key: ${RSA_PRIVATE_KEY}
  public-key: ${RSA_PUBLIC_KEY}
refresh-token:
  key: ${REFRESH_TOKEN_KEY_PREFIX}
app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS}"

  zalo-reminder:
    gateway-base-url: ${ZALO_API_BASE_URL:http://localhost:3000}
    public-app-url: ${PUBLIC_APP_URL}
    daily-limit: ${ZALO_DAILY_LIMIT:50}
    minimum-interval: ${ZALO_MIN_INTERVAL:90s}
    http-timeout: ${ZALO_HTTP_TIMEOUT:15s}
    timezone: ${REMINDER_TIMEZONE:Asia/Ho_Chi_Minh}
    scheduler-delay: ${ZALO_SCHEDULER_DELAY:10s}

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://demo:demo@demo}
