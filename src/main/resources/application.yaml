spring:
  profiles:
    active: dev
  application:
    name: graduationProject
  config:
    import: optional:file:.env.properties   
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME_POSTGRES}
    password: ${DB_PASSWORD}    
  jpa:
    hibernate:
      ddl-auto: validate 
  flyway:
    enabled: true
    baseline-on-migrate: true     
  data:
    redis:
#      url: ${REDIS_URL}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}    
rsa:
  private-key: ${RSA_PRIVATE_KEY}
  public-key: ${RSA_PUBLIC_KEY}      
refresh-token:
  key: ${REFRESH_TOKEN_KEY_PREFIX}  
app:
  cors:

    allowed-origins: "${CORS_ALLOWED_ORIGINS}"  
  