# Disable default profile - override spring.profiles.active=dev
spring.profiles.active=ci

# Application name
spring.application.name=graduationProject

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cidb}
spring.datasource.username=${DB_USERNAME_POSTGRES:ciuser}
spring.datasource.password=${DB_PASSWORD:cipass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - chỉ validate, không tạo/sửa schema
spring.jpa.hibernate.ddl-auto=validate

# Flyway - disabled vì đã chạy migrate qua Maven plugin
spring.flyway.enabled=false

# Redis (dummy values cho CI)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

# RSA keys - nhận từ GitHub Secrets qua environment variables
rsa.private-key=${RSA_PRIVATE_KEY}
rsa.public-key=${RSA_PUBLIC_KEY}

# Refresh token
refresh-token.key=${REFRESH_TOKEN_KEY_PREFIX:dummy}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost}
